<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Slide Từ Vựng Tiếng Anh Tự Động</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a1a2e; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .setup-container { width: 35%; padding: 30px; background: #162447; display: flex; flex-direction: column; gap: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.3); z-index: 10; transition: all 0.3s; }
        .setup-container.hidden { transform: translateX(-100%); width: 0; padding: 0; overflow: hidden; margin: 0; }
        h2 { color: #e43f5a; font-size: 24px; margin-bottom: 10px; }
        label { font-weight: bold; font-size: 14px; color: #cbd5e1; }
        textarea { width: 100%; height: 200px; padding: 12px; border-radius: 8px; border: none; background: #1f4068; color: #fff; font-size: 16px; resize: none; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #1f4068; color: #fff; font-size: 16px; }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #e43f5a; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ff4a68; transform: translateY(-2px); }
        
        .slide-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://plus.unsplash.com/premium_vector-1739339104172-d465f3af2028?q=80&w=3296&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover; background-position: center;
        }
        .slide-content { text-align: center; opacity: 0; transform: scale(0.9); transition: all 0.5s ease-in-out; display: none; }
        .slide-content.active { opacity: 1; transform: scale(1); display: block; }
        .vocab-word { font-size: 160px; font-weight: bold; color: #fbbf24; text-shadow: 0 0 20px rgba(251,191,36,0.4); margin-bottom: 10px; }
        .vocab-ipa { font-size: 60px; color: #818cf8; font-style: arial; margin-bottom: 25px; }
        .vocab-meaning { font-size: 80px; color: #e2e8f0; font-weight: 500; }
        
        .controls { position: absolute; bottom: 30px; display: flex; gap: 15px; background: rgba(22, 36, 71, 0.8); padding: 10px 20px; border-radius: 30px; backdrop-filter: blur(5px); }
        .ctrl-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px 10px; }
        .ctrl-btn:hover { color: #e43f5a; }
        .exit-btn { position: absolute; top: 20px; right: 20px; background: rgba(228,63,90,0.2); color: #e43f5a; padding: 8px 15px; border-radius: 20px; border: 1px solid #e43f5a; cursor: pointer; display: none; }
        .share-section { margin-top: auto; padding-top: 15px; border-top: 1px solid #1f4068; }
    </style>
</head>
<body>

    <div class="setup-container" id="setupForm">
        <h2>Bộ Tạo Slide Từ Vựng</h2>
        <div>
            <label>1. Nhập danh sách từ (Mỗi dòng 1 từ):</label>
            <textarea id="vocabInput">Hello / / Xin chào
Teacher / /ˈtiːtʃə(r)/ / Giáo viên
Student / /ˈstjuːdnt/ / Học sinh</textarea>
        </div>
        <div>
            <label>2. Thời gian mỗi từ (giây):</label>
            <input type="number" id="durationInput" value="3" min="1">
        </div>
        <div>
            <label>3. Chọn Giọng Đọc Tiếng Anh:</label>
            <select id="voiceSelect"><option value="">Đang tải giọng đọc...</option></select>
        </div>
        <button onclick="startPresentation()">Bắt Đầu Trình Chiếu</button>

        <div class="share-section">
            <button style="background: #10b981;" onclick="generateShareLink()">Copy Link Bài Học Cho HS</button>
        </div>
    </div>

    <div class="slide-container">
        <button class="exit-btn" id="exitBtn" onclick="stopPresentation()">Thoát Trình Chiếu</button>
        <div id="slideShowArea" style="width: 100%; display: flex; justify-content: center;">
            <div style="font-size: 24px; color: #cbd5e1;">Đang tải bài học...</div>
        </div>
        
        <div class="controls" id="playerControls" style="display: none;">
            <button class="ctrl-btn" onclick="prevSlide()">⏮</button>
            <button class="ctrl-btn" id="playPauseBtn" onclick="togglePause()">⏸</button>
            <button class="ctrl-btn" onclick="nextSlide()">⏭</button>
        </div>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let voices = [];
        let vocabList = [];
        let currentIndex = 0;
        let slideInterval = null;
        let isPaused = false;

        function loadVoices() {
            voices = synth.getVoices();
            let select = document.getElementById('voiceSelect');
            select.innerHTML = '';
            let enVoices = voices.filter(v => v.lang.includes('en'));
            if(enVoices.length === 0) enVoices = voices;
            enVoices.forEach(voice => {
                let option = document.createElement('option');
                option.value = voice.name;
                option.innerText = `${voice.name} (${voice.lang})`;
                select.appendChild(option);
            });
            // Sau khi tải xong giọng, kiểm tra xem link có bài học sẵn không
            checkUrlParams();
        }
        if (synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = loadVoices; }

        // Kiểm tra xem trên Link (URL) có chứa dữ liệu từ vựng không
        function checkUrlParams() {
            let urlParams = new URLSearchParams(window.location.search);
            let data = urlParams.get('data');
            let time = urlParams.get('time');
            
            if (data) {
                // Giải mã dữ liệu từ link
                let decodedData = decodeURIComponent(atob(data));
                document.getElementById('vocabInput').value = decodedData;
                if (time) document.getElementById('durationInput').value = time;
                
                // Vào thẳng chế độ học cho học sinh
                setTimeout(() => { startPresentation(); }, 500);
            } else {
                document.getElementById('slideShowArea').innerHTML = `<div style="font-size: 24px; color: #cbd5e1;">Nhập từ vựng bên trái rồi bấm nút bắt đầu...</div>`;
            }
        }

       function startPresentation() {
    let text = document.getElementById('vocabInput').value.trim();
    if(!text) return alert("Vui lòng nhập từ vựng!");

    vocabList = text.split('\n').map(line => {
        // Tự động chuẩn hóa tất cả các ký tự phân tách lạ về một mối
        let cleanLine = line.replace(/[\/\/\/\\–—]/g, '|'); // Gom gạch chéo, gạch ngang lạ
        
        // Cắt dòng dựa trên dấu gạch đứng | hoặc dấu phẩy , hoặc dấu gạch ngang -
        let parts = cleanLine.split(/[|,-]/);
        
        // Loại bỏ các phần tử rỗng do gõ dính liền nhau (như // hoặc ,,)
        parts = parts.map(p => p.trim()).filter(p => p !== '');
        
        if (parts.length === 2) {
            return {
                word: parts[0] || '',
                ipa: '',
                meaning: parts[1] || ''
            };
        } else if (parts.length >= 3) {
            return {
                word: parts[0] || '',
                ipa: parts[1] || '',
                meaning: parts[2] || ''
            };
        } else {
            return {
                word: parts[0] || '',
                ipa: '',
                meaning: ''
            };
        }
    });

    currentIndex = 0;
    isPaused = false;
    document.getElementById('setupForm').classList.add('hidden');
    document.getElementById('exitBtn').style.display = 'block';
    document.getElementById('playerControls').style.display = 'flex';
    
    renderSlide();
    playCurrentCycle();
}

        function renderSlide() {
            let area = document.getElementById('slideShowArea');
            let item = vocabList[currentIndex];
            area.innerHTML = `
                <div class="slide-content active">
                    <div class="vocab-word">${item.word}</div>
                    ${item.ipa ? `<div class="vocab-ipa">${item.ipa}</div>` : ''}
                    ${item.meaning ? `<div class="vocab-meaning">${item.meaning}</div>` : ''}
                </div>
            `;
        }

        function playCurrentCycle() {
            if (slideInterval) clearTimeout(slideInterval);
            if (isPaused) return;

            let item = vocabList[currentIndex];
            let selectedVoiceName = document.getElementById('voiceSelect').value;
            let duration = parseInt(document.getElementById('durationInput').value) * 1000;

            let utterance = new SpeechSynthesisUtterance(item.word);
            let selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) utterance.voice = selectedVoice;
            
            synth.speak(utterance);

            slideInterval = setTimeout(() => {
                if (currentIndex < vocabList.length - 1) {
                    currentIndex++;
                    renderSlide();
                    playCurrentCycle();
                } else {
                    alert("Đã hoàn thành bài học!");
                    stopPresentation();
                }
            }, duration);
        }

        // TẠO ĐƯỜNG LINK CHIA SẺ
        function generateShareLink() {
            let text = document.getElementById('vocabInput').value.trim();
            let time = document.getElementById('durationInput').value;
            if(!text) return alert("Hãy nhập từ vựng trước khi tạo link!");
            
            // Mã hóa danh sách từ để đưa lên URL không bị lỗi font tiếng Việt
            let encodedData = btoa(encodeURIComponent(text));
            
            // Lấy link hiện tại và nối thêm dữ liệu
            let baseUrl = window.location.href.split('?')[0];
            let shareUrl = `${baseUrl}?data=${encodedData}&time=${time}`;
            
            navigator.clipboard.writeText(shareUrl);
            alert("Đã copy đường link bài học! Hãy gửi link này cho học sinh.");
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('playPauseBtn').innerText = isPaused ? '▶' : '⏸';
            if (!isPaused) playCurrentCycle();
            else { clearTimeout(slideInterval); synth.cancel(); }
        }

        function nextSlide() {
            if (currentIndex < vocabList.length - 1) {
                currentIndex++; clearTimeout(slideInterval); synth.cancel(); renderSlide(); playCurrentCycle();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--; clearTimeout(slideInterval); synth.cancel(); renderSlide(); playCurrentCycle();
            }
        }

        function stopPresentation() {
            clearTimeout(slideInterval);
            synth.cancel();
            document.getElementById('setupForm').classList.remove('hidden');
            document.getElementById('exitBtn').style.display = 'none';
            document.getElementById('playerControls').style.display = 'none';
            document.getElementById('slideShowArea').innerHTML = `<div style="font-size: 24px; color: #cbd5e1;">Đã dừng trình chiếu.</div>`;
        }
        
        // Chạy tải giọng đọc lần đầu
        loadVoices();
    </script>
</body>
</html>
